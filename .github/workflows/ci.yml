name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Lint, type check, and test
    runs-on: ubuntu-latest

    env:
      # Dummy values so env.ts validation passes at import time.
      # No database is started; tests and type-checking don't connect.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/wijn
      BETTER_AUTH_SECRET: ci-secret-placeholder

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm check-types

      - name: Test
        run: pnpm test
